[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-movie-studio"
version = "0.2.0"
description = "Open-source, provider-agnostic AI movie production foundation"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1","uvicorn[standard]>=0.30,<1","python-multipart>=0.0.9,<1","pydantic-settings>=2.6,<3","httpx>=0.27,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<9","pytest-asyncio>=0.24,<1","httpx>=0.27,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["app*"]
