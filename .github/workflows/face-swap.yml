name: Face Swap
on:
  workflow_dispatch:
    inputs:
      source_url:
        description: URL to source face image
        required: false
        type: string
      target_url:
        description: URL to target video
        required: false
        type: string
      audio_url:
        description: URL to audio file
        required: false
        type: string
jobs:
  face-swap:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-face.txt
          python -c "import insightface; print('insightface', insightface.__version__)"
      - name: Download inswapper model
        run: |
          curl -L -o inswapper_128.onnx https://huggingface.co/ashleykleynhans/inswapper/resolve/main/inswapper_128.onnx
          ls -la inswapper_128.onnx
      - name: Download inputs
        run: |
          curl -fL "${{ inputs.source_url || 'https://raw.githubusercontent.com/opencv/opencv/master/samples/data/lena.jpg' }}" -o source.jpg
          curl -fL "${{ inputs.target_url || 'https://github.com/facefusion/facefusion-assets/releases/download/examples-3.0.0/target-240p.mp4' }}" -o target.mp4
          ls -la source.jpg target.mp4
          file source.jpg
          file target.mp4
      - name: Downscale target video for CPU processing
        run: |
          ffmpeg -y -i target.mp4 -vf "scale='min(640,iw)':-2" -c:v libx264 -preset ultrafast -crf 28 -an target_small.mp4
          ls -la target_small.mp4
          ffprobe -v error -select_streams v:0 -show_entries stream=nb_frames,r_frame_rate,width,height -of default=noprint_wrappers=1 target_small.mp4
      - name: Run face swap
        run: python scripts/face_swap.py source.jpg target_small.mp4 output.mp4
      - name: Clone wav2lip-onnx
        run: git clone --depth 1 https://github.com/instant-high/wav2lip-onnx.git /tmp/wav2lip-onnx
      - name: Download wav2lip model
        run: |
          curl -fL -o /tmp/wav2lip.onnx https://huggingface.co/bluefoxcreation/Wav2lip-Onnx/resolve/main/wav2lip.onnx
          ls -la /tmp/wav2lip.onnx
      - name: Install lipsync dependencies
        run: python -m pip install -r requirements-lipsync.txt
      - name: Download audio
        run: |
          curl -fL "${{ inputs.audio_url || 'https://upload.wikimedia.org/wikipedia/commons/5/52/Fr_The_Simpsons_Skateboarding.ogg?utm_source=fr.wikipedia.org&utm_campaign=index&utm_content=original' }}" -o audio.wav
          ls -la audio.wav
      - name: Run lip sync
        run: python scripts/lip_sync.py output.mp4 audio.wav final.mp4
      - name: Upload final output
        uses: actions/upload-artifact@v4
        with:
          name: final-output
          path: final.mp4
