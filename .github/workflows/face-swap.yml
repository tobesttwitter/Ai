name: Face Swap
on:
  workflow_dispatch:
    inputs:
      source_url:
        description: URL to source face image
        required: true
        type: string
      target_url:
        description: URL to target video
        required: true
        type: string

jobs:
  face-swap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install facefusion
        run: python -m pip install facefusion
      - name: Download inputs
        run: |
          curl -L "${{ inputs.source_url }}" -o source.jpg
          curl -L "${{ inputs.target_url }}" -o target.mp4
      - name: Run face swap
        run: |
          facefusion headless-run \
            -s source.jpg \
            -t target.mp4 \
            -o output.mp4 \
            --execution-providers cpu
      - name: Upload output
        uses: actions/upload-artifact@v4
        with:
          name: face-swap-output
          path: output.mp4
