name: Face Swap
on:
  workflow_dispatch:
    inputs:
      source_url:
        description: URL to source face image
        required: false
        type: string
      target_url:
        description: URL to target video
        required: false
        type: string
  push:
    paths:
      - '.face-swap-trigger'

jobs:
  face-swap:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-face.txt
          python -c "import insightface; print('insightface', insightface.__version__)"
      - name: Download inswapper model
        run: |
          curl -L -o inswapper_128.onnx https://huggingface.co/ashleykleynhans/inswapper/resolve/main/inswapper_128.onnx
          ls -la inswapper_128.onnx
      - name: Download inputs
        run: |
          curl -L "${{ inputs.source_url || 'https://raw.githubusercontent.com/opencv/opencv/master/samples/data/lena.jpg' }}" -o source.jpg
          curl -L "${{ inputs.target_url || 'https://github.com/gradio-app/gradio/raw/main/gradio/media_assets/videos/world.mp4' }}" -o target.mp4
      - name: Run face swap
        run: python scripts/face_swap.py source.jpg target.mp4 output.mp4
      - name: Upload output
        uses: actions/upload-artifact@v4
        with:
          name: face-swap-output
          path: output.mp4
