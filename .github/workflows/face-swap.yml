name: Face Swap
on:
  workflow_dispatch:
    inputs:
      source_url:
        description: URL to source face image
        required: true
        type: string
      target_url:
        description: URL to target video
        required: true
        type: string
  push:
    paths:
      - '.face-swap-trigger'

jobs:
  face-swap:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install facefusion
        run: python -m pip install facefusion
      - name: Download inputs
        run: |
          curl -L "${{ inputs.source_url || 'https://raw.githubusercontent.com/opencv/opencv/master/samples/data/lena.jpg' }}" -o source.jpg
          curl -L "${{ inputs.target_url || 'https://github.com/gradio-app/gradio/raw/main/gradio/media_assets/videos/world.mp4' }}" -o target.mp4
      - name: Downscale target video for CPU processing
        run: |
          ffmpeg -y -i target.mp4 -vf "scale='min(1280,iw)':-2" -c:v libx264 -preset ultrafast -crf 18 -an target_small.mp4
          ls -la target_small.mp4
          ffprobe -v error -select_streams v:0 -show_entries stream=nb_frames,r_frame_rate,width,height -of default=noprint_wrappers=1 target_small.mp4
      - name: Run face swap
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          facefusion headless-run \
            -s source.jpg \
            -t target_small.mp4 \
            -o output.mp4 \
            --execution-providers cpu
      - name: Upload output
        uses: actions/upload-artifact@v4
        with:
          name: face-swap-output
          path: output.mp4
