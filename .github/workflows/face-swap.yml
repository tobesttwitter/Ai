name: Face Swap
on:
  workflow_dispatch:
    inputs:
      source_url:
        description: URL to source face image
        required: true
        type: string
      target_url:
        description: URL to target video
        required: true
        type: string
  push:
    paths:
      - '.face-swap-trigger'

jobs:
  face-swap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install facefusion
        run: |
          git clone --depth 1 https://github.com/facefusion/facefusion.git /tmp/facefusion
          cd /tmp/facefusion
          python install.py default --skip-conda
      - name: Download inputs
        run: |
          curl -L "${{ inputs.source_url || 'https://raw.githubusercontent.com/opencv/opencv/master/samples/data/lena.jpg' }}" -o source.jpg
          curl -L "${{ inputs.target_url || 'https://github.com/gradio-app/gradio/raw/main/gradio/media_assets/videos/world.mp4' }}" -o target.mp4
      - name: Run face swap
        run: |
          python /tmp/facefusion/facefusion.py headless-run \
            -s source.jpg \
            -t target.mp4 \
            -o output.mp4 \
            --execution-providers cpu \
            --processors face_swapper \
            --face-swapper-model inswapper_128_fp16
      - name: Upload output
        uses: actions/upload-artifact@v4
        with:
          name: face-swap-output
          path: output.mp4
